id: "crates/cbork"
language: "rust"
layer: "library"

tasks:
  build:
    options:
      runInCI: true
    inputs:
      - "/crates/cbork/**/*.rs"
      - "/crates/cbork/**/Cargo.toml"
      - "/crates/cbork-cddl-compiler/**/*.rs"
      - "/crates/cbork-cddl-compiler/**/Cargo.toml"
      - "/crates/cbork-cddl-parser/**/*.rs"
      - "/crates/cbork-cddl-parser/**/Cargo.toml"
      - "/crates/cbork-abnf-parser/**/*.rs"
      - "/crates/cbork-abnf-parser/**/Cargo.toml"
      - "/crates/cbork-edn/**/*.rs"
      - "/crates/cbork-edn/**/Cargo.toml"
      - "/crates/cbork-catalog/**/*.rs"
      - "/crates/cbork-catalog/**/Cargo.toml"
      - "/cddl/rfc-std/**/*.cddl"
      - "/crates/cbork-utils/**/*.rs"
      - "/crates/cbork-utils/**/Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"

  # Smoke test: ensure `cbork --help` does not panic. bpaf validates the
  # struct ordering of flags vs positionals at parser-construction time,
  # which only happens for a real argv parse (not for `bpaf::run_inner`
  # in the unit tests). Driving the binary here catches the
  # "all positional and command items must be placed in the right most
  # position" class of regressions before they reach a user.
  help-smoke:
    deps:
      - "build"
    command: "bash"
    args:
      - "-lc"
      - "target/release/cbork --help"
    options:
      runFromWorkspaceRoot: true
      runInCI: true
      outputStyle: "stream"
    inputs:
      - "/crates/cbork/**/*.rs"
      - "/crates/cbork/**/Cargo.toml"
      - "/Cargo.toml"
      - "/Cargo.lock"
