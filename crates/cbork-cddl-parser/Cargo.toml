#cspell: words memchr

[package]
name = "cbork-cddl-parser"
version = "0.0.3"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Parser and validator for the CDDL grammar defined in RFC 8610 and its updates."
readme = "README.md"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
exclude = ["moon.yml"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
pest = { version = "2.8.6", features = ["std", "pretty-print", "memchr", "const_prec_climber"] }
pest_derive = { version = "2.8.6", features = ["grammar-extras"] }
anyhow = "1.0"
cbork-catalog = { path = "../cbork-catalog", version = "0.0.1" }
